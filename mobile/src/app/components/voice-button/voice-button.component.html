<div class="voice-controls">
  <ion-button
    shape="round"
    size="large"
    class="mic-btn"
    [color]="autoMode ? 'primary'
           : (isSpeaking$ | async) ? 'medium'
           : (state$ | async) === 'recording' ? 'danger'
           : (state$ | async) === 'loading' || (state$ | async) === 'transcribing' ? 'warning'
           : 'primary'"
    [disabled]="((isDisabled$ | async) && !(isRecording$ | async) && !starting) || autoMode"
    style="touch-action: none"
    (pointerdown)="onPointerDown($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (lostpointercapture)="onPointerUp($event)">
    <ion-icon
      [name]="autoMode ? 'mic-outline'
             : (isSpeaking$ | async) ? 'stop-circle-outline'
             : (state$ | async) === 'recording' ? 'mic'
             : (state$ | async) === 'loading' ? 'cloud-download-outline'
             : (state$ | async) === 'transcribing' ? 'hourglass-outline'
             : 'mic-outline'">
    </ion-icon>
  </ion-button>

  <p *ngIf="voiceError" role="alert">{{ voiceError }}</p>
  <div class="auto-toggle">
    <span class="auto-label">{{ 'voice-button.auto' | transloco }}</span>
    <ion-toggle
      [(ngModel)]="autoMode"
      (ionChange)="onAutoModeChange()">
    </ion-toggle>
  </div>
</div>
